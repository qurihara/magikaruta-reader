<!doctype html>
<html lang="ja" class="i18n-pending">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3ede0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- 画面の文言は js/i18n.js の辞書にあり、app.js が data-i18n（textContent）、data-i18n-html（HTML）、
     data-i18n-attr（「属性:鍵」を「;」で区切る）の印を見て差し替える。差し替えるまでは画面を隠す（i18n-pending）。
     title と description だけは、JavaScript を動かさないリンクの下見のために、日本語と英語を並べた固定の文も書いておく。 -->
<meta name="description" content="まじかるたの読み上げアプリ / MagiKaruta Reader: beeps tell you the number on the card." data-i18n-attr="content:meta.description">
<title data-i18n="meta.title">まじかるた 読み上げ / MagiKaruta Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='10' y='4' width='44' height='56' rx='5' fill='%23fbf8f1' stroke='%231f5a3d' stroke-width='6'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23c8381f'/%3E%3C/svg%3E">
</head>
<body>

<!-- 最初の画面。ここでのタップで AudioContext を起こし、画面の消灯を止める。 -->
<section id="splash" class="splash" aria-labelledby="splashTitle">
  <!-- 言語の切り替え。押すとその場で全部の文言が切り替わる（v0.4.0）。ボタンの文字は、それぞれの言語の名前で固定する。 -->
  <div class="lang-switch splash-lang" role="group" data-i18n-attr="aria-label:lang.group">
    <button type="button" class="lang-btn" data-lang="ja" lang="ja">日本語</button>
    <button type="button" class="lang-btn" data-lang="en" lang="en">English</button>
  </div>
  <div class="splash-inner">
    <p class="splash-kicker" data-i18n="splash.kicker"></p>
    <h1 id="splashTitle" class="splash-title" data-i18n="app.name"></h1>
    <p class="splash-sub" data-i18n="app.sub"></p>
    <p class="splash-lead" data-i18n="splash.lead"></p>
    <button id="btnStart" class="btn-primary btn-start" type="button" data-i18n="splash.start"></button>
    <ul class="splash-notes">
      <li id="noteSilent" data-i18n-html="splash.silent.html"></li>
      <li data-i18n="splash.wake"></li>
    </ul>
    <p class="splash-version"><span id="splashVersion" class="version">v0.0.0</span></p>
  </div>
</section>

<div id="app" class="app" hidden>
  <header class="top">
    <div class="brand">
      <span class="seal" aria-hidden="true">読</span>
      <span class="brand-name"><span data-i18n="app.name"></span><span class="brand-sub" data-i18n="app.sub"></span></span>
    </div>
    <nav class="top-actions">
      <button id="btnRules" class="btn-ghost" type="button" data-i18n="top.rules"></button>
      <button id="btnSettings" class="btn-ghost" type="button" data-i18n="top.settings"></button>
    </nav>
  </header>

  <!-- いまのルールと速さ。押すと「ルールと速さ」を開く。 -->
  <button id="plate" class="plate plate-public" type="button" data-i18n-attr="aria-label:plate.aria">
    <span class="plate-cell">
      <span class="plate-key" data-i18n="plate.rule"></span>
      <span class="plate-name" id="infoRule"></span>
      <span class="plate-note" id="infoRuleNote"></span>
    </span>
    <span class="plate-cell">
      <span class="plate-key" data-i18n="plate.speed"></span>
      <span class="plate-name" id="infoSpeed"></span>
      <span class="plate-note" id="infoT"></span>
    </span>
  </button>

  <section class="progress" aria-live="polite">
    <p class="count"><span class="count-label" data-i18n="count.label"></span><span id="readCount" class="count-num">0</span><span class="count-of" id="totalCount"></span></p>
    <!-- 読まれた札の履歴。そのゲームの全部の値を並べ、読まれた札を薄くして、読まれた順の番号を添える。
         直前の読みは、次の「読む」を押すか、「答えを確かめる」で答えを見るまで載せない（app.js の renderHistory）。 -->
    <div id="history" class="history" role="group" data-i18n-attr="aria-label:hist.aria">
      <div id="histBoard" class="hist-board"></div>
      <p class="hist-seq"><span class="hist-seq-key" data-i18n="hist.seqKey"></span><span id="histSeq" class="hist-seq-list"></span></p>
      <p id="histNote" class="hist-note" hidden></p>
    </div>
    <p id="statusText" class="status"></p>
    <p id="mainNotice" class="notice" hidden></p>
  </section>

  <section class="controls">
    <button id="btnRead" class="read-card" type="button">
      <span class="read-glow" aria-hidden="true"></span>
      <span class="read-label" id="readLabel"></span>
      <span class="read-sub" id="readSub"></span>
    </button>
    <div class="sub-controls">
      <button id="btnReveal" class="btn-hold" type="button" aria-describedby="revealHint">
        <span class="hold-fill" aria-hidden="true"></span>
        <span class="hold-text" data-i18n="reveal.button"></span>
        <span id="revealHint" class="hold-hint" data-i18n="reveal.hint"></span>
      </button>
      <button id="btnNewGame" class="btn-secondary" type="button" data-i18n="newGame.button"></button>
    </div>
  </section>

  <!-- 下の欄に、最初の画面に戻らずに言語を切り替えるボタンを小さく置く（v0.4.0）。 -->
  <footer class="foot">
    <div class="lang-switch foot-lang" role="group" data-i18n-attr="aria-label:lang.group">
      <button type="button" class="lang-btn" data-lang="ja" lang="ja">日本語</button>
      <button type="button" class="lang-btn" data-lang="en" lang="en">English</button>
    </div>
    <span id="version" class="version">v0.0.0</span>
  </footer>
</div>

<!-- 答えの表示（長押ししたときだけ）。 -->
<div id="reveal" class="reveal" hidden role="dialog" aria-modal="true" aria-labelledby="revealTitle">
  <div class="reveal-card">
    <p id="revealTitle" class="reveal-title" data-i18n="reveal.titleDefault"></p>
    <p class="reveal-value"><span id="revealValue">7</span><span id="revealFace" class="reveal-face"></span></p>
    <p id="revealKind" class="reveal-kind"></p>
    <p class="reveal-hist-title" data-i18n="reveal.histTitle"></p>
    <ol id="revealHistory" class="reveal-hist"></ol>
    <p class="reveal-close" data-i18n="reveal.closeHint"></p>
  </div>
</div>

<!-- 遊び方 -->
<dialog id="dlgRules" class="sheet" aria-labelledby="rulesTitle">
  <div class="sheet-head">
    <h2 id="rulesTitle" data-i18n="rules.title"></h2>
    <button class="btn-ghost" type="button" data-close data-i18n="common.close"></button>
  </div>
  <div class="sheet-body prose">
    <p class="aside" data-i18n-html="rules.video.html"></p>
    <div class="tabs" role="tablist">
      <button role="tab" type="button" class="tab" aria-selected="true" data-tab="r-basic" data-i18n="rules.tab.basic"></button>
      <button role="tab" type="button" class="tab" aria-selected="false" data-tab="r-blank" data-i18n="rules.tab.blank"></button>
      <button role="tab" type="button" class="tab" aria-selected="false" data-tab="r-t" data-i18n="rules.tab.t"></button>
      <button role="tab" type="button" class="tab" aria-selected="false" data-tab="r-redblack" data-i18n="rules.tab.redblack"></button>
    </div>
    <section id="r-basic" class="tabpanel" data-i18n-html="rules.basic.html"></section>
    <section id="r-blank" class="tabpanel" hidden data-i18n-html="rules.blank.html"></section>
    <section id="r-t" class="tabpanel" hidden>
      <h3 data-i18n="rules.t.title"></h3>
      <p data-i18n="rules.t.lead"></p>
      <ul id="speedLegend" class="speed-legend"></ul>
      <p data-i18n="rules.t.after"></p>
    </section>
    <section id="r-redblack" class="tabpanel" hidden data-i18n-html="rules.redblack.html"></section>
  </div>
</dialog>

<!-- ルールと速さ -->
<dialog id="dlgSettings" class="sheet" aria-labelledby="settingsTitle">
  <form id="settingsForm" method="dialog">
    <div class="sheet-head">
      <h2 id="settingsTitle" data-i18n="settings.title"></h2>
      <button class="btn-ghost" type="button" data-close data-i18n="common.close"></button>
    </div>
    <div class="sheet-body">
      <fieldset class="group">
        <legend data-i18n="settings.rules"></legend>
        <div class="rule-choices">
          <label class="rule-choice"><input type="radio" name="rule" value="standard">
            <span><b data-i18n="rule.standard.name"></b><small data-i18n="rule.standard.summary"></small></span></label>
          <label class="rule-choice"><input type="radio" name="rule" value="blank">
            <span><b data-i18n="rule.blank.name"></b><small data-i18n="rule.blank.summary"></small></span></label>
        </div>
        <details class="other-rules" id="otherRules">
          <summary data-i18n="settings.other"></summary>
          <label class="rule-choice"><input type="radio" name="rule" value="redblack">
            <span><b data-i18n="rule.redblack.name"></b><small data-i18n="rule.redblack.summary"></small></span></label>
        </details>
      </fieldset>

      <fieldset class="group">
        <legend data-i18n="settings.speed"></legend>
        <div class="seg seg-wrap speed-seg" role="radiogroup" data-i18n-attr="aria-label:settings.speed" id="speedSeg"></div>
        <p class="help" data-i18n="settings.speedHelp"></p>
        <div class="row"><button id="btnSoundCheck" type="button" class="btn-secondary" data-i18n="settings.soundCheck"></button>
          <span class="help" id="soundCheckHelp"></span>
        </div>
      </fieldset>
      <p class="help" id="applyHelp"></p>
    </div>
    <div class="sheet-foot">
      <button type="button" class="btn-ghost" data-close data-i18n="settings.cancel"></button>
      <button type="submit" class="btn-primary" id="btnSaveSettings" data-i18n="settings.save"></button>
    </div>
  </form>
</dialog>

<!-- 新しいゲームの確認 -->
<dialog id="dlgConfirm" class="sheet small" aria-labelledby="confirmTitle">
  <div class="sheet-body">
    <h2 id="confirmTitle" data-i18n="confirm.title"></h2>
    <p id="confirmText" data-i18n="confirm.textDefault"></p>
  </div>
  <div class="sheet-foot">
    <button type="button" class="btn-ghost" data-close data-i18n="confirm.keep"></button>
    <button type="button" class="btn-primary" id="btnConfirmNew" data-i18n="confirm.new"></button>
  </div>
</dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
